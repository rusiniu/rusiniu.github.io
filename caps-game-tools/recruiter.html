<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Caps Recruiter Pro — Оценка коллекционера</title>
    <!-- Bootstrap 5 CSS + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/common.css">
    <style>

        .card-candidate {
            border: none;
            border-radius: 1.75rem;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .card-header-custom {
            background: linear-gradient(105deg, #1a2639 0%, #0f172a 100%);
            color: white;
            padding: 1.2rem 1.8rem;
            border-bottom: 3px solid #fbbf24;
        }
        .stat-badge {
            background-color: rgba(255,255,255,0.15);
            border-radius: 40px;
            padding: 0.3rem 1rem;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .info-section {
            background-color: #ffffffcc;
            backdrop-filter: blur(2px);
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            margin-bottom: 1.25rem;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .section-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 0.9rem;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid #fbbf24;
            padding-left: 12px;
        }
        .badge-league {
            background: linear-gradient(145deg, #3b82f6, #2563eb);
            color: white;
            padding: 5px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .grade-diamond { background-color: #bae6fd; color: #0369a1; font-weight: bold; }
        .grade-epic { background-color: #e0f2fe; color: #0284c7; }
        .grade-rare { background-color: #dcfce7; color: #15803d; }
        .grade-common { background-color: #f1f5f9; color: #334155; }

        
        .avatar-frame {
            width: 70px;
            height: 70px;
            background: #1e293b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 3px solid #fbbf24;
        }
        .btn-gold {
            background: #fbbf24;
            color: #0f172a;
            font-weight: 700;
            border: none;
            transition: 0.2s;
        }
        .btn-gold:hover {
            background: #f59e0b;
            transform: scale(0.98);
        }
        .achievement-badge {
            background-color: #2d3a5e;
            color: #e2e8f0;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        footer {
            font-size: 0.75rem;
            text-align: center;
            margin-top: 2rem;
            color: #334155;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="site-header">
        <h1><i class="bi bi-person-badge"></i> Mad Caps Recruiter</h1>
        <div class="site-nav">
            <a href="index.html" class="nav-link-custom"><i class="bi bi-house"></i> Портал</a>
            <a href="market.html" class="nav-link-custom"><i class="bi bi-graph-up"></i> Аналитика рынка</a>
            <a href="collections.html" class="nav-link-custom"><i class="bi bi-images"></i> Галерея</a>
            <a href="recruiter.html" class="nav-link-custom active"><i class="bi bi-person-badge"></i> Рекрутер</a>
            <a href="finder.html" class="nav-link-custom"><i class="bi bi-search"></i> Финдер</a>
        </div>
    </div>

    <div class="row justify-content-center mb-5">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow border-0 rounded-4">
                <div class="card-body p-4">
                    <label class="form-label fw-semibold"><i class="bi bi-telegram"></i> TG ID кандидата</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-person-badge"></i></span>
                        <input type="number" id="tgIdInput" class="form-control form-control-lg" placeholder="279747791" value="279747791">
                        <button id="loadBtn" class="btn btn-gold btn-lg px-4">Анализ</button>
                    </div>
                    <div class="form-text mt-2">Введите числовой ID — данные из открытого API игры</div>
                </div>
            </div>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div id="resultContainer">
                <div id="loadingSkeleton" style="display: none;">
                    <div class="card-candidate">
                        <div class="card-header-custom"><div class="skeleton" style="width: 50%;"></div></div>
                        <div class="card-body"><div class="skeleton mb-3"></div><div class="skeleton"></div></div>
                    </div>
                </div>
                <div id="profileContent"></div>
            </div>
        </div>
    </div>
    <footer><i class="bi bi-cloud-check"></i> Данные из игры CapsGame (Firestore)</footer>
</div>

<script>
    function getFirestoreValue(field) {
        if (!field) return null;
        if (field.stringValue !== undefined) return field.stringValue;
        if (field.integerValue !== undefined) return field.integerValue;
        if (field.doubleValue !== undefined) return field.doubleValue;
        if (field.booleanValue !== undefined) return field.booleanValue;
        if (field.mapValue?.fields) return field.mapValue.fields;
        if (field.arrayValue?.values) return field.arrayValue.values;
        return null;
    }

    function buildImageUrl(path) {
        if (!path) return null;
        const encodedPath = encodeURIComponent(path);
        return `https://firebasestorage.googleapis.com/v0/b/capsgame-prod.appspot.com/o/${encodedPath}?alt=media`;
    }

    function renderProfile(data) {
        const fields = data.fields || {};
        // --- общая информация ---
        const username = fields.username?.stringValue || '—';
        const firstName = fields.first_name?.stringValue || '';
        const lastName = fields.last_name?.stringValue || '';
        const fullName = `${firstName} ${lastName}`.trim() || username;
        const tgId = fields.id?.integerValue || '—';
        const league = fields.league?.stringValue || '—';
        const battleLevel = fields.caps_battle_level?.integerValue || 0;
        const energy = fields.caps_energy?.mapValue?.fields?.value?.integerValue || 0;
        const stakingSpeed = fields.stakingSpeed?.doubleValue || 0;
        const lastSignin = fields.lastSigninAt?.timestampValue ? new Date(fields.lastSigninAt.timestampValue).toLocaleString() : '—';
        const createdAt = fields.caps_created_at?.timestampValue ? new Date(fields.caps_created_at.timestampValue).toLocaleDateString() : '—';
        
        // --- Аватар ---
        const profileObj = fields.profile?.mapValue?.fields || {};
        const avatarRawPath = profileObj.avatar?.mapValue?.fields?.url?.stringValue || null;
        const avatarUrl = avatarRawPath ? buildImageUrl(avatarRawPath) : null;
        
        // --- КОЛЛЕКЦИИ ---
        const mycapsMap = fields.caps_mycaps_map?.mapValue?.fields || {};
        const collectionsStats = mycapsMap.collections?.mapValue?.fields || {};
        let totalChipsCount = mycapsMap.count?.integerValue || 0;
        let completedCollectionsCount = 0;
        let totalCollectionsCount = 0;
        
        let gradeStats = { DIAMOND: 0, EPIC: 0, EPIC_PLUS: 0, RARE: 0, RARE_PLUS: 0, COMMON: 0, COMMON_PLUS: 0, LEGEND: 0 };
        if (mycapsMap.grades?.mapValue?.fields) {
            const grades = mycapsMap.grades.mapValue.fields;
            for (let [grade, val] of Object.entries(grades)) {
                if (gradeStats.hasOwnProperty(grade) && val.integerValue !== undefined) gradeStats[grade] = val.integerValue;
            }
        }
        for (let [colName, colData] of Object.entries(collectionsStats)) {
            totalCollectionsCount++;
            if (colData?.mapValue?.fields?.isComplete?.booleanValue === true) completedCollectionsCount++;
        }
        
        // --- Достижения ---
        const achievementsArr = fields.achievements?.arrayValue?.values || [];
        const allAchievements = achievementsArr.map(a => a.stringValue).filter(Boolean);
        
        // --- Боевая активность + exchange ---
        const playedGames = fields.caps_played_games?.mapValue?.fields || {};
        const pvpGames = playedGames.pvp?.integerValue || 0;
        const pveGames = playedGames.pve?.integerValue || 0;
        const madnessGames = playedGames.madness?.integerValue || 0;
        const exchangeGames = playedGames.exchange?.integerValue || 0;
        
        // --- PvP Grades Balance (новое поле) ---
        const pvpGradesBalance = fields.caps_pvp_grades_balance?.mapValue?.fields || {};
        // Пример: { "COMMON": { "integerValue": "-46" } }
        const pvpGradesEntries = Object.entries(pvpGradesBalance).map(([grade, val]) => ({ grade, points: val.integerValue || 0 }));
        
        // --- Формируем HTML ---
        let html = `
        <div class="card-candidate">
            <div class="card-header-custom d-flex justify-content-between align-items-center flex-wrap">
                <div class="d-flex align-items-center gap-3">
                    <div class="avatar-frame">
                        ${avatarUrl ? `<img src="${avatarUrl}" style="width:100%; height:100%; object-fit:cover;" alt="avatar">` : '<i class="bi bi-person-circle fs-1 text-white-50"></i>'}
                    </div>
                    <div>
                        <h3 class="mb-0 fw-bold">${escapeHtml(fullName)}</h3>
                        <div class="d-flex gap-2 mt-1 flex-wrap">
                            <span class="stat-badge"><i class="bi bi-at"></i> ${escapeHtml(username)}</span>
                            <span class="stat-badge"><i class="bi bi-telegram"></i> ID ${tgId}</span>
                            <span class="badge-league"><i class="bi bi-trophy-fill"></i> ${escapeHtml(league)} лига</span>
                        </div>
                    </div>
                </div>
                <div class="mt-2 mt-sm-0">
                    <span class="stat-badge"><i class="bi bi-calendar-week"></i> с ${createdAt}</span>
                </div>
            </div>
            <div class="card-body p-4">
                <!-- Основные метрики -->
                <div class="row g-3 mb-4">
                    <div class="col-md-3 col-6"><div class="info-section text-center p-2"><i class="bi bi-database fs-4"></i><br><strong>${totalChipsCount.toLocaleString()}</strong><br>всего фишек</div></div>
                    <div class="col-md-3 col-6"><div class="info-section text-center p-2"><i class="bi bi-gem fs-4"></i><br><strong>${gradeStats.DIAMOND}</strong><br>Diamond</div></div>
                    <div class="col-md-3 col-6"><div class="info-section text-center p-2"><i class="bi bi-speedometer2 fs-4"></i><br><strong>${stakingSpeed.toFixed(2)}</strong><br>скорость фарма</div></div>
                    <div class="col-md-3 col-6"><div class="info-section text-center p-2"><i class="bi bi-bar-chart-steps fs-4"></i><br><strong>${battleLevel}</strong><br>уровень боя</div></div>
                </div>
                
                <!-- Редкости фишек -->
                <div class="info-section">
                    <div class="section-title"><i class="bi bi-palette-fill"></i> Распределение по редкостям</div>
                    <div class="d-flex flex-wrap gap-2">
                        ${gradeStats.DIAMOND > 0 ? `<span class="badge grade-diamond p-2"><i class="bi bi-gem"></i> DIAMOND: ${gradeStats.DIAMOND}</span>` : ''}
                        ${gradeStats.EPIC > 0 ? `<span class="badge grade-epic p-2"><i class="bi bi-star"></i> EPIC: ${gradeStats.EPIC}</span>` : ''}
                        ${gradeStats.EPIC_PLUS > 0 ? `<span class="badge grade-epic p-2">EPIC+: ${gradeStats.EPIC_PLUS}</span>` : ''}
                        ${gradeStats.RARE > 0 ? `<span class="badge grade-rare p-2"><i class="bi bi-bookmark"></i> RARE: ${gradeStats.RARE}</span>` : ''}
                        ${gradeStats.RARE_PLUS > 0 ? `<span class="badge grade-rare p-2">RARE+: ${gradeStats.RARE_PLUS}</span>` : ''}
                        ${gradeStats.COMMON > 0 ? `<span class="badge grade-common p-2"><i class="bi bi-box"></i> COMMON: ${gradeStats.COMMON}</span>` : ''}
                        ${gradeStats.COMMON_PLUS > 0 ? `<span class="badge grade-common p-2">COMMON+: ${gradeStats.COMMON_PLUS}</span>` : ''}
                    </div>
                    <hr class="my-2">
                    <div><i class="bi bi-check2-circle text-success"></i> <strong>Завершённых коллекций:</strong> ${completedCollectionsCount} из ${totalCollectionsCount}</div>
                </div>
                
                <!-- Боевой опыт + Exchange + PvP Grades Balance -->
                <div class="info-section">
                    <div class="section-title"><i class="bi bi-crosshair"></i> Боевая статистика</div>
                    <div class="row text-center mb-3">
                        <div class="col-3"><span class="fw-bold fs-5">${pvpGames}</span><br><small>PvP битв</small></div>
                        <div class="col-3"><span class="fw-bold fs-5">${pveGames}</span><br><small>PvE битв</small></div>
                        <div class="col-3"><span class="fw-bold fs-5">${madnessGames}</span><br><small>Madness</small></div>
                        <div class="col-3"><span class="fw-bold fs-5">${exchangeGames}</span><br><small>Обменов</small></div>
                    </div>
                    ${pvpGradesEntries.length > 0 ? `
                        <div class="mt-2 pt-2 border-top">
                            <div class="fw-semibold mb-1"><i class="bi bi-trophy"></i> PvP ранговые очки:</div>
                            <div class="d-flex flex-wrap gap-2">
                                ${pvpGradesEntries.map(g => `<span class="badge bg-dark">${g.grade}: ${g.points}</span>`).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>
                
                <!-- Достижения / трофеи -->
                <div class="info-section">
                    <div class="section-title"><i class="bi bi-trophy-fill text-warning"></i> Трофеи и достижения</div>
                    <div class="d-flex flex-wrap gap-2">
                        ${allAchievements.slice(0, 28).map(ach => `<span class="achievement-badge"><i class="bi bi-award"></i> ${escapeHtml(ach)}</span>`).join('')}
                        ${allAchievements.length === 0 ? '<span class="text-muted">Нет отмеченных достижений</span>' : ''}
                        ${allAchievements.length > 28 ? `<span class="achievement-badge">+ ещё ${allAchievements.length-28}</span>` : ''}
                    </div>
                </div>
                
                <!-- Доп. информация -->
                <div class="info-section mb-0">
                    <div class="d-flex gap-3 flex-wrap">
                        <span><i class="bi bi-star-fill text-warning"></i> Premium: ${fields.is_premium?.booleanValue ? '✅ Активен' : '❌ Нет'}</span>
                        <span><i class="bi bi-wallet2"></i> Кошелёк: ${fields.caps_wallet?.stringValue ? 'привязан' : 'не привязан'}</span>
                        <span><i class="bi bi-lightning-charge-fill"></i> Энергия: ${energy}</span>
                        <span><i class="bi bi-clock-history"></i> Последний вход: ${lastSignin}</span>
                    </div>
                </div>
            </div>

        </div>
        `;
        return html;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    async function loadPlayer(tgId) {
        const loadingDiv = document.getElementById('loadingSkeleton');
        const contentDiv = document.getElementById('profileContent');
        loadingDiv.style.display = 'block';
        contentDiv.innerHTML = '';
        
        const apiUrl = `https://firestore.googleapis.com/v1/projects/capsgame-prod/databases/(default)/documents/Users/${tgId}`;
        
        try {
            const response = await fetch(apiUrl);
            if (!response.ok) {
                if (response.status === 404) throw new Error('Игрок не найден. Проверьте TG ID');
                throw new Error(`Ошибка API: ${response.status}`);
            }
            const data = await response.json();
            if (!data.fields) throw new Error('Неверный формат ответа');
            const rendered = renderProfile(data);
            contentDiv.innerHTML = rendered;
        } catch (err) {
            contentDiv.innerHTML = `
                <div class="alert alert-danger shadow rounded-4 border-0">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <strong>Ошибка:</strong> ${escapeHtml(err.message)}<br>
                    <small>Проверьте ID, интернет, возможно требуется CORS (используйте хостинг или VPN)</small>
                </div>
            `;
        } finally {
            loadingDiv.style.display = 'none';
        }
    }
    
    document.getElementById('loadBtn').addEventListener('click', () => {
        const tgId = document.getElementById('tgIdInput').value.trim();
        if (!tgId || isNaN(tgId)) {
            alert('Введите числовой Telegram ID');
            return;
        }
        loadPlayer(tgId);
    });
    
    window.addEventListener('DOMContentLoaded', () => {
        loadPlayer('279747791');
    });
</script>
</body>
</html>
