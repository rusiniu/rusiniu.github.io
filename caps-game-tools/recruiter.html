<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Caps Recruiter Pro — Оценка коллекционера</title>
    <!-- Bootstrap 5 CSS + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/common.css">
    <style>
        .card-candidate {
            border: none;
            border-radius: 1.75rem;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .card-header-custom {
            background: linear-gradient(105deg, #1a2639 0%, #0f172a 100%);
            color: white;
            padding: 1.2rem 1.8rem;
            border-bottom: 3px solid #fbbf24;
        }
        .stat-badge {
            background-color: rgba(255,255,255,0.15);
            border-radius: 40px;
            padding: 0.3rem 1rem;
            font-size: 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .info-section {
            background-color: #ffffffcc;
            backdrop-filter: blur(2px);
            border-radius: 1.2rem;
            padding: 1rem 1.2rem;
            margin-bottom: 1.25rem;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .section-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 0.9rem;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid #fbbf24;
            padding-left: 12px;
        }
        .badge-league {
            background: linear-gradient(145deg, #3b82f6, #2563eb);
            color: white;
            padding: 5px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* Стили для редкостей (от COMMON до DIAMOND) */
        .grade-common { background-color: #e2e8f0; color: #475569; font-weight: 600; }
        .grade-common-plus { background-color: #d1d9e6; color: #334155; font-weight: 600; }
        .grade-rare { background-color: #dcfce7; color: #15803d; font-weight: 600; }
        .grade-rare-plus { background-color: #bbf7d0; color: #166534; font-weight: 600; }
        .grade-epic { background-color: #dbeafe; color: #1d4ed8; font-weight: 600; }
        .grade-epic-plus { background-color: #bfdbfe; color: #1e40af; font-weight: 600; }
        .grade-legend { background-color: #fef3c7; color: #b45309; font-weight: 600; }
        .grade-legend-plus { background-color: #fde68a; color: #92400e; font-weight: 600; }
        .grade-diamond { background-color: #bae6fd; color: #0369a1; font-weight: 700; }

        .avatar-frame {
            width: 70px;
            height: 70px;
            background: #1e293b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 3px solid #fbbf24;
            flex-shrink: 0;
        }
        .btn-gold {
            background: #fbbf24;
            color: #0f172a;
            font-weight: 700;
            border: none;
            transition: 0.2s;
        }
        .btn-gold:hover {
            background: #f59e0b;
            transform: scale(0.98);
        }
        .achievement-badge {
            background-color: #2d3a5e;
            color: #e2e8f0;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .skeleton {
            background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 12px;
            height: 20px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .boss-level-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #1e293b;
            color: #e2e8f0;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
        }
        .streak-win { color: #22c55e; }
        .streak-lose { color: #ef4444; }
        footer {
            font-size: 0.75rem;
            text-align: center;
            margin-top: 2rem;
            color: #334155;
        }
        @media (max-width: 576px) {
            .card-header-custom {
                padding: 1rem;
            }
            .avatar-frame {
                width: 50px;
                height: 50px;
            }
            .info-section {
                padding: 0.75rem;
            }
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="site-header">
        <h1><i class="bi bi-person-badge"></i> Mad Caps Recruiter</h1>
        <div class="site-nav">
            <a href="index.html" class="nav-link-custom"><i class="bi bi-house"></i> Портал</a>
            <a href="market.html" class="nav-link-custom"><i class="bi bi-graph-up"></i> Аналитика рынка</a>
            <a href="collections.html" class="nav-link-custom"><i class="bi bi-images"></i> Галерея</a>
            <a href="recruiter.html" class="nav-link-custom active"><i class="bi bi-person-badge"></i> Рекрутер</a>
            <a href="finder.html" class="nav-link-custom"><i class="bi bi-search"></i> Финдер</a>
        </div>
    </div>

    <div class="row justify-content-center mb-5">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow border-0 rounded-4">
                <div class="card-body p-4">
                    <label class="form-label fw-semibold"><i class="bi bi-telegram"></i> TG ID кандидата</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i class="bi bi-person-badge"></i></span>
                        <input type="number" id="tgIdInput" class="form-control form-control-lg" placeholder="279747791" value="279747791">
                        <button id="loadBtn" class="btn btn-gold btn-lg px-4">Анализ</button>
                    </div>
                    <div class="form-text mt-2">Введите числовой ID — данные из открытого API игры</div>
                </div>
            </div>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div id="resultContainer">
                <div id="loadingSkeleton" style="display: none;">
                    <div class="card-candidate">
                        <div class="card-header-custom"><div class="skeleton" style="width: 50%;"></div></div>
                        <div class="card-body">
                            <div class="skeleton mb-3" style="height: 80px;"></div>
                            <div class="skeleton mb-3" style="height: 60px;"></div>
                            <div class="skeleton" style="height: 40px;"></div>
                        </div>
                    </div>
                </div>
                <div id="profileContent"></div>
            </div>
        </div>
    </div>
    <footer><i class="bi bi-cloud-check"></i> Данные из игры CapsGame (Firestore)</footer>
</div>

<script src="js/common.js"></script>
<script>
    (function() {
        'use strict';

        const { escapeHtml, buildImageUrl, fetchPlayerProfile, getUrlParam, getFieldValue, getSortedGrades, GRADE_MAP } = window.CapsTools;

        // Классы для редкостей
        const GRADE_CLASSES = {
            'COMMON': 'grade-common',
            'COMMON_PLUS': 'grade-common-plus',
            'RARE': 'grade-rare',
            'RARE_PLUS': 'grade-rare-plus',
            'EPIC': 'grade-epic',
            'EPIC_PLUS': 'grade-epic-plus',
            'LEGEND': 'grade-legend',
            'LEGEND_PLUS': 'grade-legend-plus',
            'DIAMOND': 'grade-diamond'
        };

        function getGradeClass(grade) {
            return GRADE_CLASSES[grade] || 'grade-common';
        }

        function renderProfile(data) {
            const fields = data.fields || {};
            // Общая информация
            const username = getFieldValue(fields, 'username', '—');
            const firstName = getFieldValue(fields, 'first_name', '');
            const lastName = getFieldValue(fields, 'last_name', '');
            const fullName = `${firstName} ${lastName}`.trim() || username;
            const tgId = getFieldValue(fields, 'id', '—');
            const league = getFieldValue(fields, 'league', '—');
            const battleLevel = getFieldValue(fields, 'caps_battle_level', 0);
            const energy = fields.caps_energy?.mapValue?.fields?.value?.integerValue || 0;
            const stakingSpeed = getFieldValue(fields, 'stakingSpeed', 0);
            const lastSignin = fields.lastSigninAt?.timestampValue ? new Date(fields.lastSigninAt.timestampValue).toLocaleString() : '—';
            const createdAt = fields.caps_created_at?.timestampValue ? new Date(fields.caps_created_at.timestampValue).toLocaleDateString() : '—';

            // Аватар
            const profileObj = fields.profile?.mapValue?.fields || {};
            const avatarRawPath = profileObj.avatar?.mapValue?.fields?.url?.stringValue || null;
            const avatarUrl = avatarRawPath ? buildImageUrl(avatarRawPath) : null;

            // Коллекции
            const mycapsMap = fields.caps_mycaps_map?.mapValue?.fields || {};
            const collectionsStats = mycapsMap.collections?.mapValue?.fields || {};
            let totalChipsCount = mycapsMap.count?.integerValue || 0;
            let completedCollectionsCount = 0;
            let totalCollectionsCount = 0;

            let gradeStats = { DIAMOND: 0, EPIC: 0, EPIC_PLUS: 0, RARE: 0, RARE_PLUS: 0, COMMON: 0, COMMON_PLUS: 0, LEGEND: 0, LEGEND_PLUS: 0 };
            if (mycapsMap.grades?.mapValue?.fields) {
                const grades = mycapsMap.grades.mapValue.fields;
                for (let [grade, val] of Object.entries(grades)) {
                    if (gradeStats.hasOwnProperty(grade) && val.integerValue !== undefined) gradeStats[grade] = val.integerValue;
                }
            }
            for (let [colName, colData] of Object.entries(collectionsStats)) {
                totalCollectionsCount++;
                if (colData?.mapValue?.fields?.isComplete?.booleanValue === true) completedCollectionsCount++;
            }

            // Достижения
            const achievementsArr = fields.achievements?.arrayValue?.values || [];
            const allAchievements = achievementsArr.map(a => a.stringValue).filter(Boolean);

            // Боевая активность
            const playedGames = fields.caps_played_games?.mapValue?.fields || {};
            const pvpGames = playedGames.pvp?.integerValue || 0;
            const pveGames = playedGames.pve?.integerValue || 0;
            const madnessGames = playedGames.madness?.integerValue || 0;
            const exchangeGames = playedGames.exchange?.integerValue || 0;

            // PvP Grades Balance
            const pvpGradesBalance = fields.caps_pvp_grades_balance?.mapValue?.fields || {};
            const pvpGradesEntries = Object.entries(pvpGradesBalance).map(([grade, val]) => ({ grade, points: val.integerValue || 0 }));

            // --- НОВЫЕ ПОЛЯ ---

            // Копилка (caps_idle_v2) - только уровень
            const idleV2 = fields.caps_idle_v2?.mapValue?.fields || {};
            // Приводим к числу, т.к. integerValue приходит как строка
            const piggyLevelRaw = idleV2.level?.integerValue;
            const piggyLevel = piggyLevelRaw !== undefined && piggyLevelRaw !== null ? Number(piggyLevelRaw) + 1 : 0;

            // Боссы (caps_bosses_level)
            const bossesLevel = fields.caps_bosses_level?.mapValue?.fields || {};
            const bossLevels = {};
            for (const [boss, val] of Object.entries(bossesLevel)) {
                if (val.integerValue !== undefined) {
                    bossLevels[boss] = Number(val.integerValue);
                }
            }
            const bossNames = {
                'lich': '🧙 Лич',
                'shaokahn': '🥋 Шао Кан',
                'shredder': '🗡️ Шреддер'
            };

            // PvP Streaks
            const pvpStreaks = fields.caps_pvp_streaks?.mapValue?.fields || {};
            const winStreak = pvpStreaks.win?.integerValue !== undefined ? Number(pvpStreaks.win.integerValue) : 0;
            const loseStreak = pvpStreaks.lose?.integerValue !== undefined ? Number(pvpStreaks.lose.integerValue) : 0;
            const lastResult = pvpStreaks.last?.stringValue || '—';

            // Сортируем редкости
            const sortedGrades = getSortedGrades(gradeStats);

            // Формируем HTML
            let html = `
            <div class="card-candidate fade-in">
                <div class="card-header-custom d-flex justify-content-between align-items-center flex-wrap">
                    <div class="d-flex align-items-center gap-3">
                        <div class="avatar-frame">
                            ${avatarUrl ? `<img src="${avatarUrl}" style="width:100%; height:100%; object-fit:cover;" alt="avatar" loading="lazy">` : '<i class="bi bi-person-circle fs-1 text-white-50"></i>'}
                        </div>
                        <div>
                            <h3 class="mb-0 fw-bold">${escapeHtml(fullName)}</h3>
                            <div class="d-flex gap-2 mt-1 flex-wrap">
                                <span class="stat-badge"><i class="bi bi-at"></i> ${escapeHtml(username)}</span>
                                <span class="stat-badge"><i class="bi bi-telegram"></i> ID ${escapeHtml(tgId)}</span>
                                <span class="badge-league"><i class="bi bi-trophy-fill"></i> ${escapeHtml(league)} лига</span>
                            </div>
                        </div>
                    </div>
                    <div class="mt-2 mt-sm-0">
                        <span class="stat-badge"><i class="bi bi-calendar-week"></i> с ${escapeHtml(createdAt)}</span>
                    </div>
                </div>
                <div class="card-body p-4">
                    <!-- Основные метрики -->
                    <div class="row g-3 mb-4">
                        <div class="col-md-3 col-6"><div class="info-section text-center p-2"><i class="bi bi-database fs-4"></i><br><strong>${totalChipsCount.toLocaleString()}</strong><br>всего фишек</div></div>
                        <div class="col-md-3 col-6"><div class="info-section text-center p-2"><i class="bi bi-gem fs-4"></i><br><strong>${gradeStats.DIAMOND}</strong><br>Diamond</div></div>
                        <div class="col-md-3 col-6"><div class="info-section text-center p-2"><i class="bi bi-speedometer2 fs-4"></i><br><strong>${stakingSpeed.toFixed(2)}</strong><br>скорость фарма</div></div>
                        <div class="col-md-3 col-6"><div class="info-section text-center p-2"><i class="bi bi-bar-chart-steps fs-4"></i><br><strong>${battleLevel}</strong><br>уровень боя</div></div>
                    </div>

                    <!-- Редкости фишек (от COMMON до DIAMOND) -->
                    <div class="info-section">
                        <div class="section-title"><i class="bi bi-palette-fill"></i> Распределение по редкостям</div>
                        <div class="d-flex flex-wrap gap-2">
                            ${sortedGrades.map(({grade, count}) => `
                                <span class="badge ${getGradeClass(grade)} p-2">
                                    ${grade.replace('_PLUS', '+')}: ${count}
                                </span>
                            `).join('')}
                            ${sortedGrades.length === 0 ? '<span class="text-muted">Нет фишек</span>' : ''}
                        </div>
                        <hr class="my-2">
                        <div><i class="bi bi-check2-circle text-success"></i> <strong>Завершённых коллекций:</strong> ${completedCollectionsCount} из ${totalCollectionsCount}</div>
                    </div>

                    <!-- Боевая статистика + PvP Streaks -->
                    <div class="info-section">
                        <div class="section-title"><i class="bi bi-crosshair"></i> Боевая статистика</div>
                        <div class="row text-center mb-3">
                            <div class="col-3"><span class="fw-bold fs-5">${pvpGames}</span><br><small>PvP битв</small></div>
                            <div class="col-3"><span class="fw-bold fs-5">${pveGames}</span><br><small>PvE битв</small></div>
                            <div class="col-3"><span class="fw-bold fs-5">${madnessGames}</span><br><small>Madness</small></div>
                            <div class="col-3"><span class="fw-bold fs-5">${exchangeGames}</span><br><small>Обменов</small></div>
                        </div>
                        ${pvpGradesEntries.length > 0 ? `
                            <div class="mt-2 pt-2 border-top">
                                <div class="fw-semibold mb-1"><i class="bi bi-trophy"></i> PvP ранговые очки:</div>
                                <div class="d-flex flex-wrap gap-2">
                                    ${pvpGradesEntries.map(g => `<span class="badge bg-dark">${escapeHtml(g.grade)}: ${g.points}</span>`).join('')}
                                </div>
                            </div>
                        ` : ''}
                        <!-- PvP Streaks -->
                        <div class="mt-2 pt-2 border-top">
                            <div class="fw-semibold mb-1"><i class="bi bi-arrow-left-right"></i> PvP серии:</div>
                            <div class="d-flex flex-wrap gap-3">
                                <span class="${winStreak > 0 ? 'streak-win' : 'text-muted'}">
                                    <i class="bi bi-arrow-up-circle-fill"></i> Побед: ${winStreak}
                                </span>
                                <span class="${loseStreak > 0 ? 'streak-lose' : 'text-muted'}">
                                    <i class="bi bi-arrow-down-circle-fill"></i> Поражений: ${loseStreak}
                                </span>
                                <span class="text-muted">
                                    <i class="bi bi-flag"></i> Последний: ${lastResult === 'win' ? '🏆 Победа' : lastResult === 'lose' ? '💀 Поражение' : lastResult}
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- Копилка (caps_idle_v2) -->
                    <div class="info-section">
                        <div class="section-title"><i class="bi bi-piggy-bank-fill"></i> Копилка</div>
                        <div class="d-flex flex-wrap gap-3">
                            <span class="stat-pill"><i class="bi bi-star-fill text-warning"></i> Уровень: <strong>${piggyLevel}</strong></span>
                        </div>
                    </div>

                    <!-- Уровни боссов -->
                    <div class="info-section">
                        <div class="section-title"><i class="bi bi-bug-fill"></i> Уровни боссов</div>
                        <div class="d-flex flex-wrap gap-2">
                            ${Object.keys(bossLevels).length > 0 ? 
                                Object.entries(bossLevels).map(([boss, level]) => `
                                    <span class="boss-level-badge">
                                        ${bossNames[boss] || boss}: ${level}
                                    </span>
                                `).join('') : 
                                '<span class="text-muted">Боссы не пройдены</span>'
                            }
                        </div>
                    </div>

                    <!-- Достижения / трофеи -->
                    <div class="info-section">
                        <div class="section-title"><i class="bi bi-trophy-fill text-warning"></i> Трофеи и достижения</div>
                        <div class="d-flex flex-wrap gap-2">
                            ${allAchievements.slice(0, 28).map(ach => `<span class="achievement-badge"><i class="bi bi-award"></i> ${escapeHtml(ach)}</span>`).join('')}
                            ${allAchievements.length === 0 ? '<span class="text-muted">Нет отмеченных достижений</span>' : ''}
                            ${allAchievements.length > 28 ? `<span class="achievement-badge">+ ещё ${allAchievements.length-28}</span>` : ''}
                        </div>
                    </div>

                    <!-- Доп. информация -->
                    <div class="info-section mb-0">
                        <div class="d-flex gap-3 flex-wrap">
                            <span><i class="bi bi-star-fill text-warning"></i> Premium: ${fields.is_premium?.booleanValue ? '✅ Активен' : '❌ Нет'}</span>
                            <span><i class="bi bi-wallet2"></i> Кошелёк: ${fields.caps_wallet?.stringValue ? 'привязан' : 'не привязан'}</span>
                            <span><i class="bi bi-lightning-charge-fill"></i> Энергия: ${energy}</span>
                            <span><i class="bi bi-clock-history"></i> Последний вход: ${escapeHtml(lastSignin)}</span>
                        </div>
                    </div>
                </div>
            </div>
            `;
            return html;
        }

        // Загрузка игрока
        async function loadPlayer(tgId) {
            const loadingDiv = document.getElementById('loadingSkeleton');
            const contentDiv = document.getElementById('profileContent');
            
            if (!tgId || isNaN(tgId)) {
                contentDiv.innerHTML = `
                    <div class="alert alert-warning shadow rounded-4 border-0">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <strong>Введите корректный числовой ID</strong>
                    </div>
                `;
                return;
            }

            loadingDiv.style.display = 'block';
            contentDiv.innerHTML = '';

            try {
                const data = await fetchPlayerProfile(tgId);
                const rendered = renderProfile(data);
                contentDiv.innerHTML = rendered;
                const newUrl = `${window.location.pathname}?tg=${tgId}`;
                window.history.replaceState({ tgId: tgId }, '', newUrl);
            } catch (err) {
                contentDiv.innerHTML = `
                    <div class="alert alert-danger shadow rounded-4 border-0">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <strong>Ошибка:</strong> ${escapeHtml(err.message)}<br>
                        <small>Проверьте ID, интернет, возможно требуется CORS (используйте хостинг или VPN)</small>
                    </div>
                `;
            } finally {
                loadingDiv.style.display = 'none';
            }
        }

        // Обработчики
        document.getElementById('loadBtn').addEventListener('click', function() {
            const tgId = document.getElementById('tgIdInput').value.trim();
            loadPlayer(tgId);
        });

        document.getElementById('tgIdInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('loadBtn').click();
            }
        });

        // Загрузка при старте
        window.addEventListener('DOMContentLoaded', function() {
            const tgFromUrl = getUrlParam('tg');
            const inputField = document.getElementById('tgIdInput');
            
            if (tgFromUrl && !isNaN(tgFromUrl)) {
                inputField.value = tgFromUrl;
                loadPlayer(tgFromUrl);
            } else {
                const defaultId = inputField.value.trim();
                if (defaultId && !isNaN(defaultId)) {
                    loadPlayer(defaultId);
                }
            }
        });

    })();
</script>
</body>
</html>
